id: feedback
title: Feedback
description: '<p>A form to submit feedback on services or content</p>'
categories: {  }
elements: |-
  helpful_options:
    '#type': radios
    '#title': 'Is this information helpful?'
    '#options':
      'yes': 'Yes'
      'no': 'No'
    '#options_display': side_by_side
    '#default_value': 'yes'
  panel_container:
    '#type': container
    '#states':
      visible:
        ':input[name="helpful_options"]':
          value: 'no'
        ':input[name="content_select"]':
          '!value': 'yes'
    flexbox:
      '#type': webform_flexbox
      content_panel_content:
        '#type': webform_flexbox
        content_panel:
          '#type': webform_markup
          '#markup': '<p><strong>Content</strong></p><p>You may have comments about the content on the webpage. For example:&nbsp;</p><ul><li data-list-item-id="e1681c61697dab1bb1fd8c5d9729e4227">The information on this page is difficult to understand</li><li data-list-item-id="efff1949854964c940a4dc886b1691c44">This page isn''t giving me the information I need</li><li data-list-item-id="e11cd040bee6ee73858395fa2c33c4bd0">This page contains information that is wrong or out of date</li><li data-list-item-id="eac83f07c374569c5b4da43beca2c611c">This page could have been written or presented better&nbsp;</li></ul><p>Your feedback will help us improve our website and the content we include.</p>'
        content_button:
          '#type': processed_text
          '#text': ' <button class="button feedback-content-button" data-value="yes">I have feedback about this page</button>'
          '#format': email_html
      service_panel_content:
        '#type': webform_flexbox
        service_panel:
          '#type': webform_markup
          '#markup': '<p><strong>Service</strong></p><p>You may have comments about the quality of the service that''s been provided. For example:</p><ul><li data-list-item-id="e85581c835b359e95e783a90bca504c70">I have waited too long for something to happen</li><li data-list-item-id="ea95831303992562c24fce28ce1394117">I''m struggling to contact the service</li><li data-list-item-id="eb1271052e8261f920f49d74d789a90b6">I don''t think I have been treated fairly</li><li data-list-item-id="e0d661ab50a6ade240f79bc45e584a7c1">I feel as if I have been misled</li></ul>'
        service_button:
          '#type': processed_text
          '#text': '<button class="button feedback-content-button">I have a complaint about this service</button>'
          '#format': email_html
  content_select:
    '#type': select
    '#title': content_select
    '#options':
      'yes': 'yes'
      'no': 'no'
    '#wrapper_attributes':
      class:
        - visually-hidden
  content_feedback_container:
    '#type': container
    '#states':
      visible:
        ':input[name="content_select"]':
          value: 'yes'
        ':input[name="helpful_options"]':
          value: 'no'
    how_easy_was_it_to_find_what_you_were_looking_for:
      '#type': radios
      '#title': 'How easy was it to find what you were looking for?'
      '#options':
        very_easy: 'Very Easy'
        easy: Easy
        acceptable: Acceptable
        difficult: Difficult
        extremely_difficult: 'Extremely Difficult'
      '#states':
        visible:
          ':input[name="content_select"]':
            value: 'yes'
    how_easy_was_this_content_to_understand:
      '#type': radios
      '#title': 'How easy was this content to understand?'
      '#options':
        very_easy: 'Very Easy'
        easy: Easy
        acceptable: Acceptable
        difficult: Difficult
        extremely_difficult: 'Extremely Difficult'
    did_you_come_across_any_barriers_or_issues_with_this_webpage:
      '#type': textfield
      '#title': 'Did you come across any barriers or issues with this webpage'
    how_could_this_page_be_improved_optional:
      '#type': textfield
      '#title': 'How could this page be improved? (optional)'
    please_leave_your_email_below_if_you_are_happy_for_us_to_contact:
      '#type': email
      '#title': 'Please leave your email below if you are happy for us to contact you further (optional)'
  actions:
    '#type': webform_actions
    '#title': 'Submit button(s)'
