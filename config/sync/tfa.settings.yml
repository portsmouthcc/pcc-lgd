enabled: true
required_roles:
  emergency_publisher: emergency_publisher
  authenticated: authenticated
  localgov_editor: localgov_editor
  localgov_author: localgov_author
  localgov_contributor: localgov_contributor
  localgov_news_editor: localgov_news_editor
  localgov_user_manager: localgov_user_manager
  localgov_admin: localgov_admin
  tro_manager: tro_manager
send_plugins: {  }
login_plugins: {  }
login_plugin_settings:
  tfa_trusted_browser:
    cookie_allow_subdomains: true
    cookie_expiration: 30
    cookie_name: tfa-trusted-browser
allowed_validation_plugins:
  tfa_totp: tfa_totp
default_validation_plugin: tfa_totp
validation_plugin_settings:
  tfa_hotp:
    counter_window: 10
    site_name_prefix: 1
    name_prefix: TFA
    issuer: Drupal
  tfa_recovery_code:
    recovery_codes_amount: 10
  tfa_totp:
    time_skew: 2
    site_name_prefix: 1
    name_prefix: TFA
    issuer: Drupal
validation_skip: 3
users_without_tfa_redirect: true
reset_pass_skip_enabled: true
encryption: encryption
tfa_flood_uid_only: 0
tfa_flood_window: 300
tfa_flood_threshold: 6
help_text: 'Your account has been temporarily locked due to too many failed verification attempts. Please contact DCE'
mail:
  tfa_enabled_configuration:
    subject: 'Two-factor authentication enabled on your [site:name] account'
    body: "Hi [user:display-name],\r\n\r\nThis is a confirmation that two-factor authentication (TFA) has been successfully enabled on your [site:name] account.\r\n\r\nYour account is now more secure. You will be asked to verify your identity using your chosen method each time you log in.\r\n\r\nIf you did not make this change, please contact us immediately by visiting [site:url].\r\n\r\nThanks,\r\nThe [site:name] Team"
  tfa_disabled_configuration:
    subject: 'Two-factor authentication disabled on your [site:name] account'
    body: "Hi [user:display-name],\r\n\r\nThis is a confirmation that two-factor authentication (TFA) has been disabled on your [site:name] account.\r\n\r\nYour account is now less protected. We strongly recommend re-enabling two-factor authentication to keep your account secure.\r\n\r\nIf you did not make this change, please contact us immediately by visiting [site:url].\r\n\r\nThanks,\r\nThe [site:name] Team"
allowed_skips: 0
